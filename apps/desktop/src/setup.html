<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
    <title>设置 Domos</title>
    <link rel="stylesheet" href="setup-theme.css" />
    <link rel="stylesheet" href="controls.css" />
    <link rel="stylesheet" href="setup-layout.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body class="setup-window">
    <header class="titlebar"><img src="icon.png" alt="" /><span>Domos</span></header>
    <main class="setup-page">
      <div class="setup-content">
      <header class="setup-heading">
      <h1>欢迎使用 Domos</h1>
      <p>选择在哪里运行 Domos。</p>
      </header>
      <form id="setup" class="setup-form">
        <fieldset id="choices" class="choice-list">
          <legend class="sr-only">运行方式</legend>
          <label class="choice-card"><input name="mode" type="radio" value="local" checked /><span class="choice-content"><strong>在这台电脑运行</strong><span class="choice-description">Bot 和聊天记录保存在这里。</span></span></label>
          <label class="choice-card"><input name="mode" type="radio" value="existing" /><span class="choice-content"><strong>连接已有 Domos</strong><span class="choice-description">使用另一台电脑或服务器上的 Bot 和聊天记录。</span></span></label>
        </fieldset>
        <fieldset id="local" class="choice-list">
          <legend>运行方式</legend>
          <label class="choice-card"><input name="runtime" type="radio" value="native" checked /><span class="choice-content"><strong>直接运行</strong><span class="choice-description">使用这台电脑，无需 Docker。</span></span></label>
          <label class="choice-card"><input name="runtime" type="radio" value="docker" /><span class="choice-content"><strong>在 Docker 中运行</strong><span class="choice-description">需要安装并启动 Docker。首次会下载运行包。</span></span></label>
          <p class="detail-note">Bot 的工作环境稍后单独选择。</p>
        </fieldset>
        <section id="remote" class="setup-form" hidden>
          <div id="saved-label" class="field" hidden><span class="field-label">已保存的连接</span><div id="saved" class="saved-connections"></div></div>
          <label class="field"><span class="field-label">连接名称</span><input id="name" class="field-control" type="text" maxlength="80" value="我的 Domos" /></label>
          <label class="field"><span class="field-label">Domos 地址</span><input id="url" class="field-control" type="url" placeholder="https://domos.example.com" spellcheck="false" /></label>
        </section>
        <div id="progress" class="connection-progress" role="status" aria-live="polite" hidden><progress></progress><span id="phase"></span></div>
        <p id="error" class="alert" role="alert" tabindex="-1" hidden></p>
        <button id="docker" type="button" class="button" data-variant="secondary" hidden>安装或启动 Docker Desktop</button>
        <div class="setup-actions"><button id="cancel" type="button" class="button" data-variant="secondary" hidden>取消准备</button><button id="continue" type="submit" class="button" data-variant="primary">继续</button></div>
      </form>
      </div>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
