http_port 3128
acl safe_ports port 80 443
acl tls_ports port 443
acl private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl global_v6 dst 2000::/3
acl ipv4 dst ipv4
http_access deny manager
http_access deny !safe_ports
http_access deny CONNECT !tls_ports
http_access deny private
http_access deny !ipv4 !global_v6
http_access allow all
cache deny all
cache_log /dev/null
access_log none
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
forwarded_for delete
via off
