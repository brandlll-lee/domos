name: Computer effects

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effects:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domos/desktop exec node -e "require('electron')"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run packages/agent/test/computer-activity.test.ts packages/agent/test/computer-input.test.ts
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test --config apps/desktop/playwright.config.ts computer-effect.spec.ts
      - if: runner.os != 'Linux'
        run: pnpm exec playwright test --config apps/desktop/playwright.config.ts computer-effect.spec.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: computer-effects-${{ matrix.os }}
          path: test-results/desktop/
          if-no-files-found: ignore
