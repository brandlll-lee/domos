name: Computer input

on:
  workflow_call:
    inputs:
      web-full:
        type: boolean
        default: false
      selection:
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-computer-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  input:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domos/desktop exec node -e "require('electron')"
      - name: Allow Electron sandbox namespaces
        if: runner.os == 'Linux'
        run: |
          electron_path=$(pnpm --filter @domos/desktop exec node -p "require('electron')")
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile domos-electron "%s" flags=(unconfined) { userns, }\n' "$electron_path" | sudo tee /etc/apparmor.d/domos-electron >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/domos-electron
      - name: Verify computer input
        env:
          VERIFY_SELECTION: ${{ inputs.selection }}
          VERIFY_WEB_FULL: ${{ inputs.web-full }}
        run: pnpm verify --job computer-input
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: computer-input-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
