name: Computer input

on:
  workflow_call:
    inputs:
      web-full:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-computer-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  input:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @domos/desktop exec node -e "require('electron')"
      - name: Allow Electron sandbox namespaces
        if: runner.os == 'Linux'
        run: |
          electron_path=$(pnpm --filter @domos/desktop exec node -p "require('electron')")
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile domos-electron "%s" flags=(unconfined) { userns, }\n' "$electron_path" | sudo tee /etc/apparmor.d/domos-electron >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/domos-electron
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test --config apps/desktop/playwright.config.ts computer-input.spec.ts
      - if: runner.os != 'Linux'
        run: pnpm exec playwright test --config apps/desktop/playwright.config.ts computer-input.spec.ts
      - name: Verify platform browser takeover
        if: runner.os != 'Linux' && !inputs.web-full
        run: |
          pnpm exec playwright install chromium --only-shell
          pnpm build
          pnpm exec playwright test browser-takeover.spec.ts --output=test-results/takeover
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: computer-input-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
