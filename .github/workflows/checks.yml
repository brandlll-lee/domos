name: Checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.scope.outputs.code }}
      native: ${{ steps.scope.outputs.native }}
      input: ${{ steps.scope.outputs.input }}
      package: ${{ steps.scope.outputs.package }}
      sandbox: ${{ steps.scope.outputs.sandbox }}
      full: ${{ steps.scope.outputs.full }}
      web_os: ${{ steps.scope.outputs.web_os }}
      evals: ${{ steps.scope.outputs.evals }}
      onboarding: ${{ steps.scope.outputs.onboarding }}
      activity: ${{ steps.scope.outputs.activity }}
      connections: ${{ steps.scope.outputs.connections }}
      work: ${{ steps.scope.outputs.work }}
      selection: ${{ steps.scope.outputs.selection }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - id: scope
        run: node .github/ci.mjs
      - uses: pnpm/action-setup@v6.1.0
      - if: steps.scope.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify selected contracts
        env:
          VERIFY_SELECTION: ${{ steps.scope.outputs.selection }}
        run: pnpm verify --job check
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit
          path: test-results/
          if-no-files-found: ignore
  native:
    needs: check
    if: needs.check.outputs.native == 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Select sandboxed system Chrome
        if: runner.os == 'Linux'
        run: echo "AGENT_BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
      - name: Verify native contracts
        env:
          VERIFY_SELECTION: ${{ needs.check.outputs.selection }}
        run: pnpm verify --job native
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
  web:
    needs: check
    if: needs.check.outputs.code == 'true' && needs.check.outputs.evals != 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.check.outputs.web_os) }}
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Select sandboxed system Chrome
        if: runner.os == 'Linux'
        run: echo "AGENT_BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Verify web workflows
        env:
          VERIFY_SELECTION: ${{ needs.check.outputs.selection }}
          VERIFY_SHARD: ${{ matrix.shard }}/2
        run: pnpm verify --job web
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  computer-input:
    needs: check
    if: needs.check.outputs.input == 'true'
    uses: ./.github/workflows/computer-input.yml
    with:
      web-full: ${{ needs.check.outputs.full == 'true' }}
      selection: ${{ needs.check.outputs.selection }}
  desktop:
    needs: check
    if: needs.check.outputs.code == 'true' && needs.check.outputs.evals != 'true'
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Verify desktop workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_SELECTION: ${{ needs.check.outputs.selection }}
          DEBUG: pw:browser
        run: pnpm verify --job desktop
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-e2e
          path: test-results/desktop/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: needs.check.outputs.package == 'true'
        with:
          name: domos-windows-test
          path: apps/desktop/release/*.exe
  sandbox:
    needs: check
    if: needs.check.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        transport: [docker, ssh]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Build work image and install egress rules
        run: |
          docker build -f deploy/workspace.Dockerfile -t domos-workspace:1.2.0 .
          docker build -f deploy/proxy.Dockerfile -t domos-egress:1 .
          sudo bash deploy/restrict-computer-egress.sh
          sudo /usr/local/sbin/domos-computer-egress --check
      - name: Prepare SSH transport
        if: matrix.transport == 'ssh'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/domos-key"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat "$RUNNER_TEMP/domos-key.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          awk '{print "domos-ci " $1 " " $2}' /etc/ssh/ssh_host_ed25519_key.pub > "$RUNNER_TEMP/domos-known-hosts"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { userInfo } from 'node:os';
          const directory = process.env.RUNNER_TEMP;
          writeFileSync(`${directory}/domos-test.json`, JSON.stringify({ computer: { ssh: {
            host: '127.0.0.1', user: userInfo().username,
            identityFile: `${directory}/domos-key`, knownHostsFile: `${directory}/domos-known-hosts`, hostKeyAlias: 'domos-ci'
          } } }));
          JS
          echo "DOMOS_TEST_CONFIG=$RUNNER_TEMP/domos-test.json" >> "$GITHUB_ENV"
      - name: Verify sandbox workflows
        env:
          VERIFY_SELECTION: ${{ needs.check.outputs.selection }}
          VERIFY_TRANSPORT: ${{ matrix.transport }}
        run: pnpm verify --job sandbox
      - name: Report application failure
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' domos-app-test 2>/dev/null || true
          docker top domos-app-test -eo pid,stat,comm 2>/dev/null || true
          docker logs --tail 30 domos-app-test 2>/dev/null || true
          docker logs --tail 30 domos-app-ssh 2>/dev/null || true
  result:
    if: always()
    needs: [check, native, web, computer-input, desktop, sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Report selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node .github/ci.mjs result
